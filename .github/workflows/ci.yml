  push_to_mirror:
    needs: verif_repo
    runs-on: ubuntu-latest

    steps:
        - name: copie the repo
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: duplicate into target repository
          uses: pixta-dev/repository-mirroring-action@v1
          with:
            target_repo_url:
              ${{ VARS.TARGET_URL }}
            ssh_private_key:
              ${{ secrets.GIT_SSH_PRIVATE_KEY }}
